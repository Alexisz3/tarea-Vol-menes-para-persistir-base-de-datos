services:
  mysql:
    image: mysql:8.4
    container_name: mysql_tas3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'
    networks:
      - red_tas3
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -Nse "SELECT 1"']
      interval: 3s
      timeout: 5s
      retries: 60
  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: phpmyadmin_tas3
    environment:
      PMA_HOST: mysql
      PMA_PORT: '3306'
    ports:
      - '127.0.0.1:8080:80'
    networks:
      - red_tas3
    depends_on:
      mysql:
        condition: service_healthy
networks:
  red_tas3:
    name: red_tas3
    driver: bridge